services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: adaptive_ages
      POSTGRES_USER: adaptive
      POSTGRES_PASSWORD: adaptive
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adaptive -d adaptive_ages"]
      interval: 5s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis_data:/data"]

  api:
    build: ./backend
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adaptive:adaptive@postgres:5432/adaptive_ages
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }

  worker:
    build: ./backend
    command: ["celery", "-A", "app.workers.celery_app:celery_app", "worker", "--loglevel=info"]
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://adaptive:adaptive@postgres:5432/adaptive_ages
      REDIS_URL: redis://redis:6379/0
    depends_on: [api, redis]

volumes:
  postgres_data:
  redis_data:
